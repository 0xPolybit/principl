name: Publish Princi release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows x86-64 release
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PRINCI_REQUIRE_NATIVE_TESTS: "1"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Install MinGW-w64 GCC
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Install LLVM/Clang and Inno Setup
        shell: pwsh
        run: choco install llvm innosetup --yes --no-progress

      - name: Add toolchains to PATH
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:ProgramFiles "LLVM\bin")
          Add-Content -Path $env:GITHUB_PATH -Value "C:\msys64\ucrt64\bin"

      - name: Check tag and package versions match
        shell: pwsh
        run: |
          $packageVersion = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") { throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $packageVersion" }

      - name: Run compiler tests
        shell: pwsh
        run: .\.github\scripts\run-tests.ps1

      - name: Build release compiler
        run: cargo build --release

      - name: Smoke-test both extensions and executable output
        shell: pwsh
        run: .\installer\smoke-test.ps1

      - name: Package installer, portable ZIP, and checksums
        shell: pwsh
        run: .\installer\package.ps1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Princi ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          draft: false
          prerelease: false
          files: |
            dist/Princi-Setup-*-x64.exe
            dist/princi-*-windows-x64.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
